<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Vinato Lookbook" />
  <title>LOOKBOOK — VINATO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { background-color: var(--bg-light); }
    .lookbook-header { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
    .lb-title { font-family: 'Great Vibes', cursive; font-size: 8rem; color: var(--black); text-align: center; }
    .lb-gallery { padding: 10vw 5vw; display: grid; gap: 5vw; grid-template-columns: repeat(12, 1fr); }
    
    .lb-img { position: relative; overflow: hidden; }
    .lb-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    .lb-1 { grid-column: 2 / 8; height: 80vh; transform: translateY(100px); }
    .lb-2 { grid-column: 9 / 12; height: 50vh; margin-top: 20vh; }
    .lb-3 { grid-column: 3 / 7; height: 60vh; }
    .lb-4 { grid-column: 8 / 12; height: 90vh; transform: translateY(-100px); }
    .lb-5 { grid-column: 1 / 13; height: 100vh; margin-top: 10vh; }
  </style>
</head>
<body data-barba="wrapper">

  <!-- Intro & Cursor -->
  <div class="custom-cursor" id="customCursor"></div>


  <nav class="navbar scrolled" id="navbar">
    <div class="nav-inner">
      <div class="nav-links nav-left">
        <a href="/store/index.html" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="/store/shop.html" class="nav-link" data-i18n="nav.shop">Shop</a>
      </div>
      <a href="/store/index.html" class="nav-logo">VINATO</a>
      <div class="nav-links nav-right">
        <a href="/store/index.html#footer" class="nav-link" data-i18n="nav.contact">Contact</a>
        <button class="lang-toggle" id="langToggle" onclick="toggleLang()" aria-label="Switch language">EN</button>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <!-- Mobile drawer -->
    <div class="mobile-menu" id="mobileMenu">
      <a href="/store/shop.html?sort=new" class="mobile-link" data-i18n="nav.new_collection">New Collection</a>
      <div class="mobile-dropdown">
        <button class="mobile-link mobile-dropdown-btn"><span data-i18n="nav.men">Men</span> <span>+</span></button>
        <div class="mobile-dropdown-content">
          <a href="/store/shop.html?gender=men&cat=jackets" data-i18n="nav.men.jackets">Jackets</a>
          <a href="/store/shop.html?gender=men&cat=shirts" data-i18n="nav.men.shirts">Shirts</a>
          <a href="/store/shop.html?gender=men&cat=sweaters" data-i18n="nav.men.sweaters">Sweaters</a>
          <a href="/store/shop.html?gender=men&cat=pants" data-i18n="nav.men.pants">Pants</a>
          <a href="/store/shop.html?gender=men&cat=underwear" data-i18n="nav.men.underwear">Underwear</a>
          <a href="/store/shop.html?gender=men&cat=shoes" data-i18n="nav.men.boots">Boots</a>
        </div>
      </div>
      <div class="mobile-dropdown">
        <button class="mobile-link mobile-dropdown-btn"><span data-i18n="nav.women">Women</span> <span>+</span></button>
        <div class="mobile-dropdown-content">
          <a href="/store/shop.html?gender=women&cat=jackets" data-i18n="nav.women.jackets">Jackets</a>
          <a href="/store/shop.html?gender=women&cat=shirts" data-i18n="nav.women.shirts">Shirts</a>
          <a href="/store/shop.html?gender=women&cat=sweaters" data-i18n="nav.women.sweaters">Sweaters</a>
          <a href="/store/shop.html?gender=women&cat=pants" data-i18n="nav.women.pants">Pants</a>
          <a href="/store/shop.html?gender=women&cat=underwear" data-i18n="nav.women.underwear">Underwear</a>
          <a href="/store/shop.html?gender=women&cat=shoes" data-i18n="nav.women.boots">Boots</a>
        </div>
      </div>
      <a href="/store/shop.html?sale=true" class="mobile-link" style="color: var(--gold);" data-i18n="nav.sale">Sale</a>
      <a href="/store/lookbook.html" class="mobile-link" data-i18n="nav.lookbook">Lookbook</a>
      <a href="/store/index.html#footer" class="mobile-link" data-i18n="nav.contact">Contact</a>
    </div>
  </nav>
  <main data-barba="container" data-barba-namespace="lookbook">
    
    <header class="lookbook-header">
      <h1 class="lb-title reveal-up">Edition 01</h1>
    </header>

    <section class="lb-gallery">
      <div class="lb-img lb-1 reveal-up skeleton"><img class="parallax-bg lazy-image blur-load" src="images/hero_section_v2_1773376481866.png" data-src="images/hero_section_v2_1773376481866.png" alt="Editorial" decoding="async" loading="lazy"></div>
      <div class="lb-img lb-2 reveal-up delay-1 skeleton"><img class="parallax-bg lazy-image blur-load" src="images/instagram_grid_1773375639452.png" data-src="images/instagram_grid_1773375639452.png" alt="Editorial" decoding="async" loading="lazy"></div>
      <div class="lb-img lb-3 reveal-up skeleton"><img class="parallax-bg lazy-image blur-load" src="images/optimized/prod_dress_silk.webp" data-src="images/optimized/prod_dress_silk.webp" alt="Editorial" decoding="async" loading="lazy"></div>
      <div class="lb-img lb-4 reveal-up delay-2 skeleton"><img class="parallax-bg lazy-image blur-load" src="images/best_sellers_section_v2_1773376524782.png" data-src="images/best_sellers_section_v2_1773376524782.png" alt="Editorial" decoding="async" loading="lazy"></div>
      <div class="lb-img lb-5 reveal-up skeleton"><img class="parallax-bg lazy-image blur-load" src="images/hero_bg_1773375626840.png" data-src="images/hero_bg_1773375626840.png" alt="Editorial" decoding="async" loading="lazy"></div>
    </section>

    <footer class="footer">
      <div class="footer-bottom" style="display: flex; justify-content: space-between; align-items: center; padding: 40px 5%; border-top: 1px solid rgba(0,0,0,0.05);">
        <p class="footer-copy" data-i18n="footer.lookbook_copy">&copy; 2026 Vinato. Discover the collection.</p>
        <div class="footer-legal">
          <a href="privacy-policy.html" class="footer-legal-link" style="font-size: 0.75rem; color: var(--gray); margin-right: 20px;" data-i18n="footer.privacy">Privacy Policy</a>
          <a href="terms-of-service.html" class="footer-legal-link" style="font-size: 0.75rem; color: var(--gray);" data-i18n="footer.terms">Terms of Service</a>
        </div>
      </div>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/@barba/core"></script>
  <script src="https://unpkg.com/@barba/prefetch"></script>
  <script src="js/i18n.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
