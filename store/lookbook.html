<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Vinato Lookbook" />
  <title>LOOKBOOK — VINATO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { background-color: var(--bg-light); }
    .lookbook-header { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
    .lb-title { font-family: 'Great Vibes', cursive; font-size: 8rem; color: var(--black); text-align: center; }
    .lb-gallery { padding: 10vw 5vw; display: grid; gap: 5vw; grid-template-columns: repeat(12, 1fr); }
    
    .lb-img { position: relative; overflow: hidden; }
    .lb-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    .lb-1 { grid-column: 2 / 8; height: 80vh; transform: translateY(100px); }
    .lb-2 { grid-column: 9 / 12; height: 50vh; margin-top: 20vh; }
    .lb-3 { grid-column: 3 / 7; height: 60vh; }
    .lb-4 { grid-column: 8 / 12; height: 90vh; transform: translateY(-100px); }
    .lb-5 { grid-column: 1 / 13; height: 100vh; margin-top: 10vh; }
  </style>
</head>
<body data-barba="wrapper">

  <!-- Intro & Cursor -->
  <div class="custom-cursor" id="customCursor"></div>

  <!-- Full Screen Menu -->
  <div class="fs-menu" id="fsMenu">
    <div class="fs-menu-bg"></div>
    <div class="fs-menu-content">
      <button class="close-menu" id="closeFsMenu">×</button>
      <nav class="fs-nav">
        <a href="index.html" class="menu-link">Home</a>
        <a href="shop.html" class="menu-link">Shop</a>
        <a href="lookbook.html" class="menu-link">Lookbook</a>
      </nav>
    </div>
  </div>

  <nav class="navbar scrolled" id="navbar">
    <div class="nav-inner">
      <div class="nav-links nav-left">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Shop</a>
      </div>
      <a href="index.html" class="nav-logo">VINATO</a>
      <div class="nav-links nav-right">
        <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <main data-barba="container" data-barba-namespace="lookbook">
    
    <header class="lookbook-header">
      <h1 class="lb-title reveal-up">Edition 01</h1>
    </header>

    <section class="lb-gallery">
      <div class="lb-img lb-1 reveal-up"><img class="parallax-bg" src="images/hero_section_v2_1773376481866.png" alt="Editorial" loading="lazy"></div>
      <div class="lb-img lb-2 reveal-up delay-1"><img class="parallax-bg" src="images/instagram_grid_1773375639452.png" alt="Editorial" loading="lazy"></div>
      <div class="lb-img lb-3 reveal-up"><img class="parallax-bg" src="images/optimized/prod_dress_silk.webp" alt="Editorial" loading="lazy"></div>
      <div class="lb-img lb-4 reveal-up delay-2"><img class="parallax-bg" src="images/best_sellers_section_v2_1773376524782.png" alt="Editorial" loading="lazy"></div>
      <div class="lb-img lb-5 reveal-up"><img class="parallax-bg" src="images/hero_bg_1773375626840.png" alt="Editorial" loading="lazy"></div>
    </section>

    <footer class="footer">
      <div class="footer-bottom">
        <p class="footer-copy">© 2026 Vinato. Discover the collection.</p>
      </div>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/@barba/core"></script>
  <script src="js/animations.js"></script>
</body>
</html>
